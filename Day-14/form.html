<html>
     <head>
        <meta charset="UTF-8">

       <link rel="stylesheet" href="form.css">
       <link rel="icon" href="images/logo_favicon.png" type="image/png">
        <title>Join us</title>
    </head>
    <body id="form-body">
                <header>
            <img  id="synexus-logo" src="images/logo_favicon.png" alt="Synexus-logo">
            <div>
                <span style="color:orange;">Sy</span><span style="color:violet;">nexus</span>
            
            </div>
            
            <nav role="navigation" id="nav-bar">
                <a   id="home" href="index.html">Home</a>
               <a id="about"   href="index.html">About</a>
                <a id="initiatives" href="index.html">Initiatives</a>
                <a  id="contact" href="index.html">Contact</a>
            </nav>
        </header>
        <main>
            <div id="form-parent">
            <h1>Enter Your details below</h1>
            <div id="membership-form">
            <form action="form.html" method="post">
                <div><label for="enter your name"> Enter full name:</label>          
                    <input type="text" id="full-name" placeholder="enter your full name"></div>
                     <br>
                     <div><label for="enter your username" > Enter username:</label>
                    <input minlength="6" maxlength="12" type="text" id="username" placeholder="enter your username" required></div>
                    
                    <br>
                    <div><label for="enter your email"> Enter your email:</label>
                    <input type="email" id="email" placeholder="enter your email" required> </div>
                    
                    <br>
                    <div><label for="enter your roll number"> Enter your roll number : </label>
                    <input type="text" id="email" placeholder="enter your roll number" required></div>

                    <br>
                    <div>
                        <label for="introduction of the applicant">Tell us about yourself</label>
                    <textarea maxlength="300" name="about-applicant" id="about-applicant" required>Introduction about you im 300 characters</textarea>
                    </div>
                    
                    <div id="form-buttons-grid"><input class="community-join" id="reset" type="reset">
                    <input class="community-join" id="submit" type="submit"></div>
                                     
            </form>
            
            </div>
            <p>
                Note: details entered above will be permanent. enter your details carefully.
            </p>
       </div>
        </main>
